name: Python Page Builder & Deploy

on:
  push:
    branches: ["main"] # bzw. master
  workflow_dispatch:

# Berechtigungen, die GitHub Pages für Actions benötigt
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python-Skript ausführen
        run: python generate_page.py

      - name: Dateien für GitHub Pages hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Verzeichnis, in dem die index.html liegt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4